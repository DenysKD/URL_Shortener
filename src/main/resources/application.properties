spring.application.name=URL_Shortener

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54321}/${DB_NAME:url_shortener}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

application.base-url=${APP_BASE_URL:http://localhost:8080}
